<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>循环心理暗示工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="style.css">
  <link rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f1115">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div id="starFlash">⭐</div>


  
<!-- Bubble主菜单 -->
<div id="mainMenu" class="screen active">
    <div class="menu">
        <h1 onclick="showAddDeckModal()" class="secondary">Cyclic Psychology Player</h1>
        <div class="bubbles" id="bubbles"></div>
    </div>
</div>


<!-- 卡组bubble模态弹窗 -->
<!-- 卡组bubble模态弹窗 -->
<div id="deckModal" class="modal">
    <div class="modal-content">

        <div class="deck-modal-header">
            <h3 id="modalTitle">新建Deck</h3>

            <div class="deck-basic-info">
                <input
                    type="text"
                    id="deckName"
                    placeholder="🐱分类名称"
                >

                <input
                    type="text"
                    id="deckIcon"
                    placeholder="📌图标"
                    maxlength="2"
                >
            </div>
        </div>

        <textarea
            id="deckNote"
            rows="24"
            placeholder="要点总结..."
            style="">
        </textarea>

        <!-- 复习前确认按钮：阅读完分类笔记后才能进入复习 -->
        <button id="deckGoBtn" type="button" onclick="goFromDeckReview()">Go</button>

        <style>
            #deckModal .modal-content {
                width: min(92vw,760px);
                max-height: 90vh;
                display: flex;
                flex-direction: column;
                padding: 22px;
            }

            /* 标题 + 两个输入框 */
            #deckModal .deck-modal-header {
                display: flex;
                align-items: center;
                gap: 18px;
                margin-bottom: 8px;
            }

            #deckModal .deck-modal-header h3 {
                margin: 0;
                white-space: nowrap;
            }

#deckModal .deck-basic-info {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
}

#deckModal #deckName {
    flex: 1;
    min-width: 0;
    width: 0;
    box-sizing: border-box;
}

#deckModal #deckIcon {
    width: 55px;
    min-width: 55px;
    flex-shrink: 0;
    box-sizing: border-box;
}

            #deckModal .deck-basic-info input {
                box-sizing: border-box;
                padding: 9px 12px;
                background: #262b36;
                color: white;
                border: none;
                border-radius: 10px;
                outline: none;
            }

            #deckModal #deckName {
                flex: 1;
                min-width: 0;
            }

            #deckModal #deckIcon {
                width: 55px;
                text-align: center;
            }

           /* ==================== 输入框统一样式 ==================== */

#newFront,
#deckNote {
    font-family:
        "LXGW WenKai",
        "Maple Mono SC NF",
        "PingFang SC",
        sans-serif;

    font-size: 18px;
    line-height: 1.8;
    letter-spacing: .2px;

    width: 100%;
    padding: 20px;

    background: #262b36;
    color: #f7f7f7;

    border: none;
    border-radius: 18px;

    resize: none;
    outline: none;

    white-space: pre-wrap;
    box-sizing: border-box;
}


/* 获得焦点时 */

#newFront:focus,
#deckNote:focus {
    background: #262b36;
    box-shadow: none;
}


/* ==================== newFront 模态框布局 ==================== */

#newFront {
    flex: 1;
    min-height: 320px;
    max-height: 60vh;
}


/* ==================== deckNote ==================== */

#deckNote {
    flex: 1;
    min-height: 320px;
    max-height: 60vh;
    margin-top: 15px;
}


/* ==================== 手机端 ==================== */

@media (max-width: 768px) {

    #addCardModal .modal-content {
        width: 96vw;
        height: 92vh;
        max-height: 92vh;
        padding: 18px;
        box-sizing: border-box;
    }

    #cardModalTitle {
        font-size: 20px;
    }

    #cardDeckSelect {
        height: 38px;
        font-size: 14px;
    }

    #newFront {
        flex: 1;
        min-height: 0;
        height: auto;
        max-height: none;

        font-size: 18px;
        line-height: 1.8;
    }

    #deckModal #deckNote {
        height: 65vh;
        min-height: 500px;
        max-height: none;
    }

    .tool-btn {
        min-width: 48px;
        height: 44px;
    }
}
          @media (max-width: 600px) {
                #deckModal #deckNote {
                height: 65vh;
                min-height: 500px;
                max-height: none;
    }
}
        </style>

<div class="deck-modal-footer">
    <div class="footer-left">
        <button
            id="deleteDeckBtn"
            style="background-color: red;"
            onclick="deleteCurrentDeck()"
        >删除</button>

        <button
            id="toggleDeckHiddenBtn"
            class="secondary"
            onclick="toggleEditingDeckHidden()"
        >隐藏</button>
    </div>

    <div class="footer-right">
        <button
            id="cancelDeckBtn"
            class="secondary"
            onclick="hideDeckModal()"
        >取消</button>

        <button
            onclick="saveDeck()"
            id="saveBtn"
        >创建</button>
    </div>
</div>

    </div>
</div>

<!-- 已隐藏分类管理模态弹窗 -->
<div id="hiddenDeckModal" class="modal">
    <div class="modal-content hidden-deck-modal-content">
        <div class="hidden-deck-header">
            <h3>管理已隐藏分类</h3>
            <button class="secondary hidden-deck-close" onclick="hideHiddenDeckModal()">关闭</button>
        </div>
        <div id="hiddenDeckList" class="hidden-deck-list"></div>
        <div id="hiddenDeckEmpty" class="hidden-deck-empty">暂无隐藏分类</div>
    </div>
</div>

  
  
<!-- 卡片播放器 -->
<div id="player" class="screen">
   <!-- 顶部菜单 --> 
   <div class="topbar">
        <span id="deckTitle" onclick="backToMenu();" style="font-weight:600;"></span>
        <button id="moreBtn" aria-label="更多">⋯</button>
             <div id="weightBadge" class="weight-badge"></div>
        <span id="counter">1 / 1</span>
    </div>
   <!-- 播放器布局 --> 
    <div class="player-layout">
        <div class="container">
            <div class="card" onclick="if(!isMobileDevice()) nextCard()">
              <!-- 手机端触摸区域视觉分区 -->
<div class="touch-zone-overlay" aria-hidden="true">
    <div class="touch-zone-divider touch-zone-divider-1"></div>
    <div class="touch-zone-divider touch-zone-divider-2"></div>
</div>
                <div class="front" id="frontContainer">
                    <div class="front-content" id="front"></div>
                </div>
            </div>
        </div>
    </div>
</div>

  
<!-- 卡片底部...more菜单 -->
<div id="moreMenu" class="more-menu">
          <button id="editCardBtn" onclick="editCurrentCard();closeMenu()"><span class="icon">✏️</span>Edit</button>
  <button onclick="editCurrentDeckNote();closeMenu()"><span class="icon">📝</span>Note</button>


    <button onclick="showAddCardModal();closeMenu()"><span class="icon">➕</span>Add</button>
    <button id="deleteCardBtn" onclick="deleteCurrentCard();closeMenu()"><span class="icon">🗑️</span>Delete</button>

        <button id="masteredBtn" onclick="markMastered()"><span class="icon">⭐</span>Less-</button>
        <button id="importantBtn" onclick="markImportant()"><span class="icon">⭐</span>More+</button>

        <button onclick="prevCard();closeMenu()"><span class="icon">⬅</span>Previous</button>
        <button onclick="nextCard();closeMenu()"><span class="icon">➡</span>Next</button>
  
    <input type="file" id="csvInput" accept=".csv,.txt,.tsv" style="display:none" onchange="importCSV(event)">
    <button onclick="openImportModal();closeMenu()"><span class="icon">📥</span>Import</button>
    <div style="display: flex;">
        <button class="secondary" id="autoBtn" onclick="toggleAuto();closeMenu()"><span class="icon">▶</span> AutoPlay</button>
        <input style="display:none;" type="number" id="intervalInput" value="2.5" min="5" style="width:45px;background:#262b36;color:white;border:none;border-radius:8px;padding:8px;">
    </div>
  
    <button onclick="backToMenu();closeMenu()"><span class="icon">↩</span>Exit</button>
    <button onclick="toggleImmersiveMode();closeMenu()"><span class="icon">⛶</span>Immersive</button>

      <button id="moveCardBtn" onclick="moveCurrentCard();closeMenu()"><span class="icon">📂</span>Move</button>
</div>


  



<!-- 卡片编辑/添加模态弹窗 -->
<div id="addCardModal" class="modal">
    <div class="modal-content">
    <div class="modal-title-row">
        <h3 id="cardModalTitle">添加新卡片</h3>
        <select id="cardDeckSelect"></select>
    </div>

        <div class="mini-toolbar">
            <button type="button"
                class="tool-btn red"
                onclick="wrapSelection('!!','!!')">
                🔴
            </button>

            <button type="button"
                class="tool-btn mark-highlight"
                onclick="wrapSelection('{{','}}')">
                🟨
            </button>

            <button type="button"
                class="tool-btn font-size"
                onclick="wrapSelection('[[',']]')">
                ᴀA
            </button>

            <button type="button"
                class="tool-btn bold"
                onclick="wrapSelection('**','**')">
                B
            </button>

            <button type="button"
                class="tool-btn underline"
                onclick="wrapSelection('__','__')">
                U
            </button>

            <button type="button"
                class="tool-btn clean"
                onclick="cleanTextarea(activeTextarea)">
                ✂️
            </button>
        </div>

        <textarea id="newFront" rows="10" onfocus="activeTextarea='newFront'" placeholder="输入卡片内容...">
        </textarea>
      
<div class="card-modal-footer">
    <div class="card-footer-left">
        <button
            id="deleteCardBtn"
            class="card-delete-btn"
            onclick="deleteCurrentCard()"
        >🗑️</button>
    </div>

    <div class="card-footer-right">
        <button
            id="cancelCardBtn"
            class="card-cancel-btn"
            onclick="hideAddCardModal()"
        >❌</button>

        <button
            id="saveCardBtn"
            class="card-save-btn"
            onclick="saveCard()"
        >保存</button>
    </div>
</div>
<style>
  /* 卡片弹窗底部 */
.card-modal-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    width: 100%;
    margin-top:12px;
}

.card-footer-left,
.card-footer-right {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* 删除 */
.card-delete-btn {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
}

/* 取消 */
.card-cancel-btn {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
}

/* 保存 */
.card-save-btn {
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
}
</style>
      
</div>


<!-- 卡片移动模态弹窗 -->  
<div id="moveCardModal" class="modal">
    <div class="modal-content">
        <h3>移动卡片到其它分类</h3>
        <select id="moveDeckSelect" style="width:100%;padding:12px;margin-top:20px;background:#262b36;color:white;border:none;border-radius:10px;font-size:16px;"></select>
        <div style="margin-top:20px;text-align:right;">
            <button onclick="hideMoveCardModal()" class="secondary">取消</button>
            <button onclick="confirmMoveCard()">移动</button>
        </div>
    </div>
</div>


<!-- 批量导入模态弹窗 -->  
<div id="importModal" class="modal">
    <div class="modal-content">
        <h3>批量导入卡片</h3>
        <textarea
            id="importText"
            placeholder="一行一张卡片&#10;&#10;例如：&#10;记得喝水😊&#10;站起来活动一下&#10;保护颈椎"
            rows="15"></textarea>

        <div class="import-tip">
            自动去重 · 自动过滤空行
        </div>
        <div class="modal-buttons">

            <button class="secondary-btn"
                    onclick="closeImportModal()">
                ❌
            </button>
            <button class="primary-btn"
                    onclick="confirmImport()">
                ✔️
            </button>
        </div>

    </div>
</div>

  
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
<script src="script.js"></script>
<script>
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(registration => {
                console.log('Service Worker 注册成功');
            })
            .catch(error => {
                console.error('Service Worker 注册失败:', error);
            });
    });
}
</script>
</body>
</html>
